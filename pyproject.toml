[project]
name = "daze-addon"
version = "0.4.0"
description = "Dazebox EV Charger Custom Component for Home Assistant"
requires-python = ">=3.14.2"
dependencies = ["pydaze==0.1.1"]

[dependency-groups]
dev = [
  "aiohttp>=3.9.3",
  "homeassistant>=2026.8.3",
  "homeassistant-stubs>=2026.8.3",
  "pydaze==0.1.1",
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "ruff>=0.16.5",
  "voluptuous>=0.13.1",
]

[project.scripts]
daze-addon = "daze_addon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["custom_components/daze"]
