name: Build and Release

on:
  release:
    types: [created, published]

jobs:
  release-zip:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Get Version
        id: get_version
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Patch manifest.json
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          MANIFEST="custom_components/daze/manifest.json"

          # Validate it looks like a version string
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Warning: Version '${VERSION}' may not follow semver"
          fi

          # Backup original
          cp "$MANIFEST" "${MANIFEST}.backup"

          # Apply patch
          jq --arg version "$VERSION" '.version = $version' "$MANIFEST" > "${MANIFEST}.new"
          mv "${MANIFEST}.new" "$MANIFEST"

          # Verify JSON is still valid
          jq empty "$MANIFEST" || {
            echo "ERROR: manifest.json is no longer valid JSON!"
            cp "${MANIFEST}.backup" "$MANIFEST"
            exit 1
          }

          echo "Successfully patched version to ${VERSION}"

      - name: Package Custom Component
        run: |
          mkdir -p dist
          COMPONENT_NAME=$(jq -r '.domain' custom_components/daze/manifest.json)

          cd "custom_components/${COMPONENT_NAME}"
          zip -r "${GITHUB_WORKSPACE}/dist/${COMPONENT_NAME}.zip" .

          echo "Package created: dist/${COMPONENT_NAME}.zip"

      - name: Upload Release ZIP
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.zip
          tag_name: ${{ github.event.release.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
